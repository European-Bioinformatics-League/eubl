# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild, so that past rounds are marked as finished without a commit.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -C "${{ runner.temp }}/hugo" -xzf "${{ runner.temp }}/hugo.tar.gz"
          echo "${{ runner.temp }}/hugo" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
