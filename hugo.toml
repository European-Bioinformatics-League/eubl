baseURL = "https://eubl.org/"
locale = "en"
title = "European Bioinformatics League"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  short = "EUBL"
  description = "A team competition in bioinformatics and computational biology for higher-education students across Europe."
  # The edition shown on the home page and used by shortcodes by default.
  currentEdition = "2027"
  registrationURL = "https://docs.google.com/forms/d/e/1FAIpQLScXM7rclVt-fubMXJ6j_PJHGuNRVs46jlBiPmZMOV9efB4BDw/viewform?usp=dialog"
  registrationOpens = "2026-11-16T00:00:00Z"
  registrationCloses = "2026-12-17T23:59:59Z"
  email = "contact@eubl.org"
  sourceURL = "https://github.com/European-Bioinformatics-League/eubl"

# Top navigation, in display order.
[menus]
  [[menus.main]]
    name = "How it works"
    pageRef = "/competition"
    weight = 10
  [[menus.main]]
    name = "Rules"
    pageRef = "/rules"
    weight = 20
  [[menus.main]]
    name = "Preparation"
    pageRef = "/preparation"
    weight = 30
  [[menus.main]]
    name = "Editions"
    pageRef = "/editions"
    weight = 40
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 50
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 60

[markup.goldmark.renderer]
  # Allows plain HTML inside Markdown files when really needed.
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[minify]
  minifyOutput = true
