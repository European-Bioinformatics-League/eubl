<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <div>
      <p class="footer-title">{{ site.Title }}</p>
      <p>{{ site.Params.description }}</p>
    </div>
    <div>
      <p class="footer-title">Contact</p>
      <p><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></p>
    </div>
    <div>
      <p class="footer-title">This website</p>
      <p>Built with <a href="https://gohugo.io/">Hugo</a>; it sets no cookies and loads nothing from third parties. <a href="{{ site.Params.sourceURL }}">Source on GitHub</a>.</p>
    </div>
  </div>
</footer>
